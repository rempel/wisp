# Pacotes do Wisp: .deb e AppImage para Linux (`npm run dist`) e o instalador do Windows
# (`npm run dist:win`, Fase 33). Saem em dist/.
appId: io.github.rempel.Wisp
productName: Wisp
executableName: wisp
copyright: Copyright © 2026 rempel
directories:
  output: dist
  buildResources: build
# Tira o app padrão do Electron, que vem junto com o node_modules/electron/dist.
afterPack: build/after-pack.cjs
# O Electron do node_modules (o mesmo dos testes); nada é baixado.
electronDist: node_modules/electron/dist
# Sem asar: o relay dos hooks e o navegador do Claude (Playwright) rodam com o Electron em modo
# Node a partir de arquivos de verdade, e os ícones vão para os .desktop e para a bandeja.
asar: false
files:
  - out/**
  - resources/**
  - package.json
  # A licença (GPL-3.0) vai junto de toda cópia distribuída.
  - LICENSE
  - '!**/*.map'
  # Os testes de unidade montados (npm test) não vão no pacote.
  - '!out/test/**'
  # O Electron de ARM64 baixado para montar os pacotes ARM64 (scripts/electron-arm64.mjs).
  - '!.cache/**'
  # Do node-pty (o modo terminal), o código-fonte em C fica de fora; os binários de outros sistemas
  # saem no afterPack. Nada de `files` em linux: ou win: o electron-builder não junta essa lista
  # com esta, e uma lista só de exclusões vira "**/*": o pacote levava o projeto inteiro (src,
  # test, e2e, docs).
  - '!node_modules/node-pty/{deps,third_party,src,scripts,typings}/**'
# O node-pty usa a N-API: o pty.node compilado no npm install serve para o Electron sem
# recompilar (e recompilar baixaria os cabeçalhos do Electron).
npmRebuild: false
electronFuses:
  # O relay dos hooks e o Playwright MCP rodam com ELECTRON_RUN_AS_NODE.
  runAsNode: true
  # Ninguém injeta código pelo ambiente nem abre o inspetor do processo principal.
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: false
  enableEmbeddedAsarIntegrityValidation: false
linux:
  target:
    - deb
    - AppImage
  # No Linux, o pty.node compilado no npm install: os binários de Windows e macOS (prebuilds) o
  # afterPack tira.
  category: Utility
  icon: build/icons
  maintainer: rempel <rempel@users.noreply.github.com>
  synopsis: A little light on your desktop.
  # Também é o Comment do .desktop.
  description: Um mascote que flutua na tela e conversa com o Claude Code
  # O .desktop se chama io.github.rempel.Wisp.desktop (o id que os portais conferem).
  syncDesktopName: true
  # O mascote precisa do XWayland para ficar no topo e se posicionar.
  executableArgs:
    - --ozone-platform=x11
  desktop:
    entry:
      Name: Wisp
      GenericName: Assistente
      GenericName[pt_BR]: Assistente
      StartupWMClass: io.github.rempel.Wisp
deb:
  # As ações do menu de apps (clique direito no ícone). No AppImage não há caminho fixo para elas:
  # lá, o Wisp escreve a entrada dele em ~/.local/share/applications.
  desktop:
    entry:
      Actions: toggle;new;
    desktopActions:
      toggle:
        Name: Abrir ou fechar o painel
        Exec: /opt/Wisp/wisp --ozone-platform=x11 --toggle
      new:
        Name: Nova conversa
        Exec: /opt/Wisp/wisp --ozone-platform=x11 --new
  # O perfil do AppArmor (Ubuntu 23.10 em diante) vem do modelo do electron-builder: deixa o
  # /opt/Wisp/wisp criar user namespaces, que o sandbox do Chromium usa.
  # Abrir apps (gtk-launch, ou o gio) e o volume do sistema pela voz (wpctl, ou o pactl).
  recommends:
    - libgtk-3-bin | libglib2.0-bin
    - wireplumber | pulseaudio-utils
appImage:
  # O AppImage com o runtime estático: roda sem o libfuse2, que o Ubuntu 24.04 não traz mais.
  artifactName: Wisp-${version}-${arch}.AppImage
toolsets:
  appimage: 1.0.3
# O Windows (Fase 33): um instalador por usuário (sem pedir administrador), no menu Iniciar e na
# área de trabalho. O node-pty traz o binário dele pronto (prebuilds/win32-x64 e win32-arm64; o
# afterPack tira o da outra arquitetura, os de outros sistemas e o build/ compilado no npm
# install). O de ARM64 (Fase 40) sai com --arm64 e o Electron de
# ARM64 (scripts/electron-arm64.mjs ... win32), no job do Windows do CI. Com um certificado nos
# segredos do CI (WIN_CSC_LINK e WIN_CSC_KEY_PASSWORD), o electron-builder assina os dois.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icons/256x256.png
  artifactName: Wisp-${version}-Setup-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Wisp
  # O endereço wisp:// das notificações com botões (Fase 35), registrado e tirado pelo instalador.
  include: build/nsis/installer.nsh
# Sem atualização automática: os pacotes saem nos releases do GitHub.
publish: null
