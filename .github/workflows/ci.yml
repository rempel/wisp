# CI do Wisp: a cada push e pull request, tipos, lint, formatação, build e testes de unidade; em
# jobs à parte, os testes de ponta a ponta (Xvfb e DevTools), os pacotes (.deb e AppImage para
# x86-64, com o AppImage aberto de verdade, e ARM64, e o Flatpak, instalado e aberto) e o aviso das
# dependências. Numa tag v*, os pacotes vão para um release.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint, build e testes de unidade
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npx electron-vite build
      - run: npm test

  # O que pede atualização (Fase 28): falhas de segurança conhecidas nas dependências do app, o
  # Electron e o Claude Code. Só avisa (anotações e uma tabela no resumo do job): não derruba o CI.
  deps:
    name: Dependências
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/deps-check.mjs

  e2e:
    name: Ponta a ponta (Xvfb e DevTools)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Os .deb do apt ficam em cache entre os pushes (scripts/ci-apt.sh).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/apt
          key: apt-e2e-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-e2e-${{ runner.os }}-
      - name: X virtual, D-Bus, as bibliotecas do Electron e o EDS (agenda)
        timeout-minutes: 25
        run: |
          scripts/ci-apt.sh xvfb xauth dbus dbus-x11 xdotool openbox evolution-data-server \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 fonts-dejavu-core
      - run: npm ci
      - run: npx install-electron
      - run: npx electron-vite build
      - run: e2e/run.sh
      # A memória e a CPU medidas no e2e/consumo.mjs (Fase 23), no resumo do job: uma mudança que
      # piora aparece aqui, de um commit para o outro.
      - name: Consumo
        if: always()
        run: |
          if [ -f out/consumo.json ]; then
            { echo '### Consumo (e2e/consumo.mjs)'; echo '```json'; cat out/consumo.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Logs do app, se algo falhar
        if: failure()
        run: find /tmp -maxdepth 2 -path '*wisp-e2e-*' -name wisp.log -exec tail -n 50 {} \;

  package:
    name: Pacotes .deb e AppImage
    # A versão mais antiga do Ubuntu com runner: o que for montado aqui roda nas mais novas.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run build
      - run: npx electron-builder --linux deb AppImage --publish never
      # Os .deb do apt ficam em cache entre os pushes (scripts/ci-apt.sh).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/apt
          key: apt-package-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-package-${{ runner.os }}-
      - name: X virtual e D-Bus, para abrir o AppImage
        timeout-minutes: 25
        run: |
          scripts/ci-apt.sh xvfb xauth dbus \
            libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6
      # O conteúdo do .deb, e o AppImage aberto de verdade num HOME vazio.
      - run: scripts/smoke-packages.sh
      # Os pacotes para baixar e validar (e para o release, numa tag). Guardados por poucos dias,
      # para não encher a cota de armazenamento da conta; fora de uma tag, a cota cheia não
      # derruba o CI (o teste dos pacotes, acima, já passou).
      - uses: actions/upload-artifact@v6
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: pacotes-linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # Os pacotes para ARM64, montados aqui mesmo (x86-64) com o Electron de ARM64 e o node-pty
  # compilado pelo compilador cruzado (scripts/package-arm64.sh). Abrir pede uma máquina ARM: aqui,
  # a conferência é da arquitetura e do conteúdo.
  package-arm64:
    name: Pacotes ARM64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Os .deb do apt ficam em cache entre os pushes (scripts/ci-apt.sh).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/apt
          key: apt-arm64-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-arm64-${{ runner.os }}-
      # Um push teve o job cancelado aos 30 minutos só neste passo (o espelho do apt lento): agora
      # ele tem tempo limite e novas tentativas, e o que já foi baixado vem do cache.
      - name: O compilador cruzado
        timeout-minutes: 25
        run: scripts/ci-apt.sh g++-aarch64-linux-gnu file
      - run: npm ci
      - run: npx install-electron
      - run: npm run build
      - run: scripts/package-arm64.sh
      - run: scripts/smoke-arm64.sh
      - uses: actions/upload-artifact@v6
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: pacotes-linux-arm64
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # O Flatpak: o app montado pelo electron-builder sobre a base do Electron do Flathub, instalado e
  # aberto de verdade (scripts/smoke-flatpak.sh).
  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Os .deb do apt ficam em cache entre os pushes (scripts/ci-apt.sh).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/apt
          key: apt-flatpak-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-flatpak-${{ runner.os }}-
      - name: O flatpak-builder e a base do Electron
        timeout-minutes: 30
        run: |
          scripts/ci-apt.sh flatpak flatpak-builder xvfb xauth dbus dbus-x11 curl
          # O bubblewrap do Flatpak precisa de user namespaces, que o AppArmor do Ubuntu 24.04 trava.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - run: npm ci
      - run: npx install-electron
      - run: npm run build
      - run: npx electron-builder --linux dir --publish never
      - run: |
          flatpak-builder --user --install --force-clean --disable-rofiles-fuse \
            --repo=.flatpak-repo .flatpak-build build/flatpak/io.github.rempel.Wisp.yml
      - run: scripts/smoke-flatpak.sh
      - run: |
          flatpak build-bundle .flatpak-repo dist/Wisp.flatpak io.github.rempel.Wisp \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v6
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: pacote-flatpak
          path: dist/Wisp.flatpak
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [package, package-arm64, flatpak, e2e]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: pacotes-linux
          path: dist
      - uses: actions/download-artifact@v6
        with:
          name: pacotes-linux-arm64
          path: dist
      - uses: actions/download-artifact@v6
        with:
          name: pacote-flatpak
          path: dist
      - name: Publica os pacotes no release da tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Wisp $GITHUB_REF_NAME" --generate-notes
