# CI do Wisp: a cada push e pull request, tipos, lint, formatação, build e testes de unidade; em
# jobs à parte, os testes de ponta a ponta (Xvfb e DevTools) e os pacotes .deb e AppImage, que são
# conferidos (o AppImage é aberto de verdade). Numa tag v*, os pacotes vão para um release.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint, build e testes de unidade
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npx electron-vite build
      - run: npm test

  e2e:
    name: Ponta a ponta (Xvfb e DevTools)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: X virtual, D-Bus, as bibliotecas do Electron e o EDS (agenda)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus dbus-x11 xdotool openbox evolution-data-server \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 fonts-dejavu-core
      - run: npm ci
      - run: npx install-electron
      - run: npx electron-vite build
      - run: e2e/run.sh
      - name: Logs do app, se algo falhar
        if: failure()
        run: find /tmp -maxdepth 2 -path '*wisp-e2e-*' -name wisp.log -exec tail -n 50 {} \;

  package:
    name: Pacotes .deb e AppImage
    # A versão mais antiga do Ubuntu com runner: o que for montado aqui roda nas mais novas.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run build
      - run: npx electron-builder --linux deb AppImage --publish never
      - name: X virtual e D-Bus, para abrir o AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus \
            libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6
      # O conteúdo do .deb, e o AppImage aberto de verdade num HOME vazio.
      - run: scripts/smoke-packages.sh
      # Os pacotes para baixar e validar (e para o release, numa tag). Guardados por poucos dias,
      # para não encher a cota de armazenamento da conta; fora de uma tag, a cota cheia não
      # derruba o CI (o teste dos pacotes, acima, já passou).
      - uses: actions/upload-artifact@v6
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: pacotes-linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [package, e2e]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: pacotes-linux
          path: dist
      - name: Publica os pacotes no release da tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Wisp $GITHUB_REF_NAME" --generate-notes
