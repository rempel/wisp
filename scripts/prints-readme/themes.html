<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 2052px;
        height: 520px;
        overflow: hidden;
      }
      body {
        font-family: Inter, 'Noto Sans', 'DejaVu Sans', sans-serif;
        background: linear-gradient(135deg, #0b1a2e 0%, #141432 55%, #22164a 100%);
        display: flex;
        gap: 36px;
        padding: 36px;
      }
      figure {
        width: 640px;
      }
      img {
        display: block;
        width: 640px;
        height: 400px;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }
      figcaption {
        margin-top: 16px;
        text-align: center;
        font-size: 20px;
        font-weight: 600;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <figure>
      <img src="DARK" alt="" />
      <figcaption>Dark</figcaption>
    </figure>
    <figure>
      <img src="LIGHT" alt="" />
      <figcaption>Light</figcaption>
    </figure>
    <figure>
      <img src="CONTRAST" alt="" />
      <figcaption>High contrast</figcaption>
    </figure>
  </body>
</html>
